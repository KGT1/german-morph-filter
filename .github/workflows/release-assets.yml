name: Publish Dictionary Files

on:
  release:
    types: [created]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # Build from the released tag, not from whatever master points to now
      - uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          ref: ${{ github.event.release.tag_name }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Prepare source dictionary
        run: |
          mkdir -p tmp/input tmp/output
          unzip external/german-morph-dictionaries/morf_dict.zip -d tmp/input

      - name: Generate filtered dictionaries and wordlists
        run: |
          cd src
          python filter_whitelist.py ../tmp/input/DE_morph_dict.txt ../tmp/output/whitelist_dict.txt ../data/whitelists/ADJ_whitelist.txt ../data/whitelists/NN_whitelist.txt
          python filter_sensible.py ../tmp/input/DE_morph_dict.txt ../tmp/output/DE_morph_dict_filtered.txt
          python build_wordlists.py
          cp ../data/output/wordlist_main.json ../data/output/wordlist_kids.json ../tmp/output/

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" --clobber \
            tmp/input/DE_morph_dict.txt \
            tmp/output/whitelist_dict.txt \
            tmp/output/DE_morph_dict_filtered.txt \
            tmp/output/wordlist_main.json \
            tmp/output/wordlist_kids.json

      - name: Commit updated dictionaries to master
        run: |
          git fetch origin master
          # Built files are safe in the git-ignored tmp/output; discard the in-tree copies
          git checkout -f master
          cp tmp/output/whitelist_dict.txt tmp/output/DE_morph_dict_filtered.txt \
             tmp/output/wordlist_main.json tmp/output/wordlist_kids.json data/output/
          git add data/output/whitelist_dict.txt data/output/DE_morph_dict_filtered.txt \
                  data/output/wordlist_main.json data/output/wordlist_kids.json
          if git diff --cached --quiet; then
            echo "Dictionary files already up to date"
            exit 0
          fi
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git commit -m "Update dictionary files for release ${{ github.event.release.tag_name }}"
          git push origin master
